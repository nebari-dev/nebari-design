name: Notify Review Requested to Slack

on:
  pull_request:
    types: [review_requested]

jobs:
  notify-slack:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const reviewers = context.payload.requested_reviewer;

            core.setOutput('pr_title', pr.title);
            core.setOutput('pr_url', pr.html_url);
            core.setOutput('pr_number', pr.number);
            core.setOutput('repo', context.repo.repo);
            core.setOutput('author', pr.user.login);
            core.setOutput('author_url', pr.user.html_url);
            core.setOutput('reviewer', (reviewers && reviewers.login) || 'Unassigned');
            core.setOutput('reviewer_url', (reviewers && reviewers.html_url) || '');

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🚀 PR review request*"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*PR #${{ steps.pr-details.outputs.pr_number }}: <${{ steps.pr-details.outputs.pr_url }}|${{ steps.pr-details.outputs.pr_title }}>*"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repository:*
${{ steps.pr-details.outputs.repo }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Requested by:*
<${{ steps.pr-details.outputs.author_url }}|${{ steps.pr-details.outputs.author }}>"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Reviewer(s):*
<${{ steps.pr-details.outputs.reviewer_url }}|${{ steps.pr-details.outputs.reviewer }}>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
