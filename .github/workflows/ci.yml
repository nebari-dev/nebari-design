name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (but never an in-progress main run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Dependabot only edits package.json (it has no bun.lock support), so on
# Dependabot PRs we regenerate bun.lock and push it back to the branch.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the PR branch tip (not the detached merge ref) so the
          # bun.lock sync step below can push back to it. Empty on push events,
          # where checkout falls back to the triggering ref.
          ref: ${{ github.head_ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            # Dependabot bumps package.json but leaves bun.lock stale, so a
            # frozen install would fail. Regenerate the lockfile instead.
            echo "Dependabot PR: regenerating bun.lock to match package.json"
            bun install
          else
            bun install --frozen-lockfile
          fi

      - name: Sync bun.lock (Dependabot only)
        if: github.actor == 'dependabot[bot]'
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already in sync — nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore(deps): sync bun.lock with package.json"
            git push
          fi

      - name: Guard against Tailwind v3 motion-token syntax
        # `duration-[--token]` / `ease-[--token]` compiles to an invalid value
        # under Tailwind v4, so `transition-duration` resets to `0s` and the
        # transition silently does nothing. Nothing else in this pipeline
        # catches it — see AGENTS.md "Motion & animation". Markdown is excluded
        # because the docs cite the broken form as a counterexample.
        run: |
          if git grep -nE '(duration|ease)-\[--' -- '*.tsx' '*.ts' '*.css'; then
            echo "::error::Tailwind v3 motion-token syntax found. Use duration-(--token) / ease-(--token) instead."
            exit 1
          fi

      - name: Biome (format + lint + imports)
        run: bun run ci

      - name: Type check
        run: bunx tsc --noEmit

      - name: Install Playwright (Chromium) for Storybook browser tests
        run: bunx playwright install --with-deps chromium

      - name: Test (unit + Storybook a11y, with coverage)
        run: bun run test:coverage

      - name: Build registry
        run: bun run build:registry
